services:
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs the full pipeline (facility master -> simulator -> engines) and loads
  # the database. Exits when done; the API starts after it succeeds.
  pipeline:
    build: .
    command: sh -c "python -m sentinel all && python -m sentinel load-db"
    environment:
      DATABASE_URL: postgresql+psycopg://sentinel:sentinel@db:5432/sentinel
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: uvicorn sentinel.api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://sentinel:sentinel@db:5432/sentinel
    ports:
      - "8000:8000"
    depends_on:
      pipeline:
        condition: service_completed_successfully

  web:
    build: ./web
    environment:
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
